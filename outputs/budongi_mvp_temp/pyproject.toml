[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jipdam"
version = "0.1.0"
description = "Evidence-grounded real-estate tool-calling MVP scaffold"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jipdam = "budongi.cli:main"
budongi = "budongi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
