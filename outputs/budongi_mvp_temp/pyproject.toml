[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jipdam"
version = "0.1.0"
description = "Evidence-grounded real-estate tool-calling MVP scaffold"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "openpyxl>=3.1"]

[project.scripts]
jipdam = "budongi.cli:main"
budongi = "budongi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
budongi = ["static/*.html", "static/*.js", "static/*.css", "source_registry.json", "statistics_sources.json"]
